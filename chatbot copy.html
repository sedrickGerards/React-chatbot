<!DOCTYPE html>
<html lang="en">
<head>

    <title> 
        React exercise

    </title>
</head>
<body>
    <div class="js-container"></div>


    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">


        function ProductDetail(props) {

            const {product, price, discountPrice, imageSrc} = props

            // if (discountPrice){
            //     return (
            //         <>
            //     <div>
            //         {product}
            //     </div>
            //         <del>Price: {price}</del>
            //        <p> Discount Price: {discountPrice}</p>
            //        </>
            //     )
            // }

            return (

                <>
                <div>{product}</div>
                <div>
                    <img width="70" src={imageSrc}/>
                </div>

                {discountPrice ? (
                    <>
                      <del>Price: {price}</del>
                      <p>Discount Price; {discountPrice}</p>
                    </>):
                  <div>
                    Price: {price}
                  </div>
                }


                <div>
                    <button>Add to Cart</button>
                </div>
                </>
            )
        }

        function App(){
            return (
                <>
                <ProductDetail product="Cotton Socks" price="$10.90" discountPrice="5.45" imageSrc="./cotton-socks.png"/>
                <ProductDetail product="Tennis Balls" price="$6.00" imageSrc="./tennis-balls.png"/>
                <ProductDetail product="Plain T-Shirt" price="$7.99" imageSrc="./plain-t-shirt.png"/>
            </>
        )

          };

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>
</html>
